apiVersion: v1
kind: ServiceAccount
metadata:
  name: kong-cert-sync
  namespace: cert-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kong-cert-sync
rules:
  # 在 cert-manager 命名空间中的权限
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kong-cert-sync
  namespace: cert-manager  # 只绑定到 cert-manager 命名空间
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kong-cert-sync
subjects:
  - kind: ServiceAccount
    name: kong-cert-sync
    namespace: cert-manager
